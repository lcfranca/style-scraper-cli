[workspace]
members = [
  "crates/style-scraper-cli",
  "crates/style-scraper-core",
  "crates/style-scraper-probe-runner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/style-scraper"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = "thin"
