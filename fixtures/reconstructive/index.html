<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Style Scraper Reconstructive Fixture</title>
    <style>
      :root {
        --color-surface: #ffffff;
        --color-text: #1f2937;
        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --radius-card: 12px;
        --shadow-card: 0 12px 30px rgba(15, 23, 42, 0.18);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-surface: #111827;
          --color-text: #f9fafb;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e0f2fe;
        color: var(--color-text);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .auth-card {
        width: 360px;
        padding: var(--space-6);
        border-radius: var(--radius-card);
        background: var(--color-surface);
        box-shadow: var(--shadow-card);
      }

      .logo {
        width: 44px;
        height: 44px;
        margin-bottom: var(--space-4);
        color: var(--color-primary);
      }

      .alert {
        display: flex;
        gap: var(--space-3);
        padding: var(--space-3);
        border: 1px solid #bfdbfe;
        border-radius: 10px;
        background: #eff6ff;
      }

      .alert::before {
        content: "!";
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: var(--color-primary);
        color: #ffffff;
        font-weight: 700;
      }

      button {
        width: 100%;
        margin-top: var(--space-4);
        padding: var(--space-3) var(--space-4);
        border: 0;
        border-radius: 8px;
        background: var(--color-primary);
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 160ms ease, outline-color 160ms ease;
      }

      button:hover,
      button:focus-visible {
        background: var(--color-primary-hover);
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      @media (max-width: 520px) {
        .auth-card {
          width: calc(100vw - 32px);
          padding: var(--space-4);
        }
      }
    </style>
  </head>
  <body>
    <main class="auth-card">
      <svg class="logo" viewBox="0 0 44 44" role="img" aria-label="Fixture mark">
        <rect width="44" height="44" rx="12" fill="currentColor"></rect>
        <circle cx="22" cy="22" r="9" fill="white"></circle>
      </svg>
      <h1>Welcome back</h1>
      <div class="alert" role="alert">
        <strong>Security checkpoint</strong>
        <span>Confirm this browser before continuing.</span>
      </div>
      <form>
        <button type="button">Continue</button>
      </form>
    </main>
  </body>
</html>
